<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SoundAngles — Muzikale intro</title><style>*{box-sizing:border-box}body{margin:0;color:white;font-family:system-ui,Arial;background:#070d29}main{max-width:1250px;margin:auto;padding:16px}.stage{position:relative;aspect-ratio:16/9;overflow:hidden;border:2px solid #8876e8;border-radius:24px;background:radial-gradient(circle at 85% 15%,#6950ae 0%,transparent 42%),linear-gradient(120deg,#293c82,#39236e 65%,#242d70);box-shadow:0 12px 55px #0008}.stage:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(110deg,transparent 0 80px,#ffffff05 82px);pointer-events:none}.brand{position:absolute;top:5%;left:5%;font-size:clamp(13px,2vw,24px);font-weight:900;letter-spacing:.13em;color:#e9f7ff}.slide{position:absolute;inset:12% 5% 9%;display:flex;align-items:center;gap:4%;animation:enter .55s ease}.words{width:47%;z-index:2}.words h1{font-size:clamp(24px,4.1vw,53px);line-height:1.08;margin:0 0 18px}.words p{font-size:clamp(13px,1.7vw,23px);line-height:1.5;color:#eef2ff}.words strong{color:#b6edff}.diagram{width:49%;filter:drop-shadow(0 8px 20px #060a3066)}svg{width:100%;height:auto}svg line,svg path{stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round}svg circle{fill:#fff}svg text{fill:#fff;font:22px Georgia,serif}.diagram .sel{stroke:#75edff;stroke-width:5;filter:drop-shadow(0 0 6px #6fe8ff)}.diagram .other{stroke:#fff8;stroke-width:2}.label{display:inline-block;background:#ffffff22;border:1px solid #ffffff66;border-radius:40px;padding:7px 14px;font-size:clamp(12px,1.3vw,18px);letter-spacing:.05em;margin-bottom:14px}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}button,a.btn{border:1px solid #938af5;background:#1a2458;color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;cursor:pointer;text-decoration:none}button:hover{background:#35478e}.bar{height:6px;background:#ffffff25;margin-top:14px;border-radius:8px;overflow:hidden}.bar div{height:100%;background:#7eeaff;width:0}.time{margin-left:auto;color:#c8d8ff}.foot{font-size:13px;color:#bcc9f0}.sound{position:absolute;bottom:3%;right:5%;font-size:13px;color:#d7f8ff}@keyframes enter{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}@media(max-width:650px){.slide{inset:13% 5% 10%;flex-direction:column;gap:0}.words{width:100%}.words h1{font-size:24px;margin-bottom:8px}.words p{font-size:13px;margin:6px 0}.diagram{width:75%;max-height:50%}.label{margin-bottom:5px}.stage{aspect-ratio:4/5}.brand{top:3%}.sound{bottom:2%}}</style></head><body><main><div class="stage"><div class="brand">♫ SOUNDANGLES <span style="opacity:.6">/ INTRO</span></div><div id="slide"></div><div id="soundLabel" class="sound"></div></div><div class="bar"><div id="progress"></div></div><div class="controls"><button id="play">▶ Start intro met muziek</button><button id="prev">← Vorige</button><button id="next">Volgende →</button><button id="mute">🔊 Geluid aan</button><span class="time" id="counter"></span><a class="btn" href="level1.html?solo=1">Naar het spel ↗</a></div><p class="foot">Deze afspeelbare introductie gebruikt de originele SoundAngles-muziekbestanden op GitHub. Klik op Start om geluid toe te staan.</p></main><script>
const root='https://raw.githubusercontent.com/Intunez/3SoundAngles3/main/audio/';
const slides=[
{tag:'DE MISSIE',title:'Hoor de muziek. Zie de hoeken.',body:'Muziek helpt je onthouden waar hoeken liggen. Luister goed en ontdek de geheime verbanden.',kind:'intro',audio:null},
{tag:'LEVEL 1 · BINNEN',title:'Binnen voelt veilig.',body:'Een <strong>binnenhoek</strong> ligt tussen de twee evenwijdige lijnen. Denk aan <strong>majeur</strong>: open, rustig en veilig.',kind:'inside',audio:'hint_major_level1.mp3'},
{tag:'LEVEL 1 · BUITEN',title:'Buiten voelt onveilig.',body:'Een <strong>buitenhoek</strong> ligt buiten de twee evenwijdige lijnen. Denk aan <strong>mineur</strong>: het wringt een beetje.',kind:'outside',audio:'hint_minor_level1.mp3'},
{tag:'LEVEL 2 · 1 VAN 5',title:'Overeenkomstige hoeken',body:'Een hoek binnen en een hoek buiten, maar op <strong>dezelfde positie</strong> bij een ander snijpunt. Denk aan een <strong>canon</strong>: dezelfde melodie op een ander moment. Nooit andersom!',kind:'corresponding',audio:'Overeenkomstig_canon.mp3'},
{tag:'LEVEL 2 · 2 VAN 5',title:'Verwisselende binnenhoeken',body:'<strong>Binnen = majeur.</strong> Verschillende snijpunten, tegenovergestelde kanten van de snijlijn. <strong>Slide to the left, slide to the right!</strong>',kind:'altInside',audio:'VerwisBinnen_slide_majeur.mp3'},
{tag:'LEVEL 2 · 3 VAN 5',title:'Binnenhoeken aan dezelfde kant',body:'<strong>Binnen = majeur.</strong> Verschillende snijpunten, maar aan <strong>dezelfde kant</strong> van de snijlijn. <strong>’t Is stil aan de overkant!</strong>',kind:'sameInside',audio:'ZelfdeBinnen_stiloverkant_majeur.mp3'},
{tag:'LEVEL 2 · 4 VAN 5',title:'Verwisselende buitenhoeken',body:'<strong>Buiten = mineur.</strong> Verschillende snijpunten, tegenovergestelde kanten van de snijlijn. <strong>Slide to the left, slide to the right!</strong>',kind:'altOutside',audio:'VerwisBuiten_slide_mineur.mp3'},
{tag:'LEVEL 2 · 5 VAN 5',title:'Buitenhoeken aan dezelfde kant',body:'<strong>Buiten = mineur.</strong> Verschillende snijpunten, maar aan <strong>dezelfde kant</strong> van de snijlijn. <strong>’t Is stil aan de overkant!</strong>',kind:'sameOutside',audio:'ZelfdeBuiten_stiloverkant_mineur.mp3'},
{tag:'KLAAR VOOR DE UITDAGING?',title:'Luister. Kijk. Kies.',body:'<strong>Binnen = majeur. Buiten = mineur.</strong> Zelfde positie = overeenkomstig. Andere kant = verwisselend. Zelfde kant = dezelfde kant. <strong>Jij bent klaar voor SoundAngles!</strong>',kind:'intro',audio:null}
];
const pairs={inside:['A3'],outside:['A1'],corresponding:['A1','B1'],altInside:['A3','B1'],sameInside:['A4','B1'],altOutside:['A1','B3'],sameOutside:['A2','B3']};
function diagram(kind){let selected=pairs[kind]||[];let paths='';for(let [p,x,y] of [['A',160,125],['B',255,275]]){for(let j=1;j<=4;j++){let ang=[-180,-123,0,57][j-1],end=[-123,0,57,180][j-1],rad=v=>v*Math.PI/180,r=40;let x1=x+r*Math.cos(rad(ang)),y1=y+r*Math.sin(rad(ang)),x2=x+r*Math.cos(rad(end)),y2=y+r*Math.sin(rad(end));let on=selected.includes(p+j);paths+='<path class="'+(on?'sel':'other')+'" d="M'+x1.toFixed(1)+' '+y1.toFixed(1)+' A40 40 0 0 1 '+x2.toFixed(1)+' '+y2.toFixed(1)+'"/>';let mid=rad((ang+end)/2),tx=x+59*Math.cos(mid),ty=y+59*Math.sin(mid);paths+='<text x="'+tx.toFixed(1)+'" y="'+ty.toFixed(1)+'" text-anchor="middle" font-weight="'+(on?'bold':'normal')+'">'+j+'</text>'}}return '<svg viewBox="0 0 470 400" role="img" aria-label="Twee evenwijdige lijnen met snijlijn en gemarkeerde hoeken"><line x1="35" y1="125" x2="440" y2="125"/><line x1="35" y1="275" x2="440" y2="275"/><line x1="100" y1="30" x2="330" y2="390"/><text x="440" y="114">a</text><text x="440" y="264">b</text><text x="90" y="30">c</text>'+paths+'<circle cx="160" cy="125" r="5"/><circle cx="255" cy="275" r="5"/><text x="168" y="112">A</text><text x="264" y="261">B</text></svg>'}
let index=0,playing=false,muted=false,deadline=0,timer=null;const audio=new Audio();audio.preload='auto';audio.addEventListener('error',()=>document.getElementById('soundLabel').textContent='Audio niet geladen — controleer internet');
function show(){let s=slides[index];document.getElementById('slide').innerHTML='<section class="slide" key="'+index+'"><div class="words"><span class="label">'+s.tag+'</span><h1>'+s.title+'</h1><p>'+s.body+'</p></div><div class="diagram">'+diagram(s.kind)+'</div></section>';document.getElementById('counter').textContent=(index+1)+' / '+slides.length;document.getElementById('progress').style.width=(index/slides.length*100)+'%';document.getElementById('soundLabel').textContent=s.audio?'♫ Origineel muziekfragment':'';audio.pause();audio.currentTime=0;if(s.audio&&playing&&!muted){audio.src=root+s.audio;audio.play().catch(()=>{document.getElementById('soundLabel').textContent='Klik op ▶ om muziek te starten'})}deadline=Date.now()+10500}
function start(){playing=!playing;document.getElementById('play').textContent=playing?'⏸ Pauze':'▶ Verder';if(playing){show();timer=setInterval(()=>{if(Date.now()>=deadline){index=(index+1)%slides.length;show()}},250)}else{clearInterval(timer);audio.pause()}}
document.getElementById('play').onclick=start;document.getElementById('next').onclick=()=>{index=(index+1)%slides.length;show()};document.getElementById('prev').onclick=()=>{index=(index+slides.length-1)%slides.length;show()};document.getElementById('mute').onclick=()=>{muted=!muted;audio.muted=muted;document.getElementById('mute').textContent=muted?'🔇 Geluid uit':'🔊 Geluid aan';if(!muted&&playing)show()};show();
</script></body></html>
