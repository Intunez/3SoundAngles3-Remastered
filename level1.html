<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <title>LEVEL 1 — Binnen of buitenhoek</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #1d012b;
      color: #fff;
    }

    /* NAVIGATIEBALK (zoals op intro) */
    .nav-buttons {
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 30px;
      padding: 18px 20px;
      background: linear-gradient(180deg, #2e104b, #1b0733);
      border-bottom: 3px solid #ff4fd6;
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
    }

    .nav-buttons a {
      font-size: 18px;
      font-weight: 800;
      color: #ffffff;
      text-decoration: none;
      background: rgba(12, 0, 32, 0.9);
      padding: 10px 26px;
      border-radius: 999px;
      letter-spacing: 0.5px;
      transition: 0.2s ease;
    }

    .nav-buttons a:hover {
      background: #ff4fd6;
      transform: translateY(-2px) scale(1.04);
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 20px 60px;
    }

    h1 {
      margin: 0 0 5px;
      font-size: 32px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .small {
      font-size: 14px;
      opacity: 0.85;
    }

    .btn {
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-primary {
      background: #ff4fd6;
      color: #fff;
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .btn-secondary {
      background: #2e104b;
      color: #fff;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 8px 0 10px;
      font-size: 14px;
      opacity: 0.9;
    }

    .status-bar span {
      margin-right: 16px;
    }

    /* Tekst van de te benoemen hoek ------------------------------ */

    .angle-name-container {
      margin-bottom: 10px;
      font-size: 18px;
    }

    .angle-name-label {
      opacity: 0.8;
      margin-right: 6px;
    }

    .angle-name-value {
      font-weight: 700;
      font-size: 22px;
    }

    /* SPEELVELD -------------------------------------------------- */

    .board-wrapper {
      background: radial-gradient(circle at top left, #742c9b, #1b0227);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 0 30px rgba(0,0,0,0.6);
    }

    .board {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      background: #170021;
      /* verhouding van hoeken.png: 441 x 296, maar we houden je oude ratio aan */
      aspect-ratio: 786 / 473;
    }

    .diagram {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .diagram-inner {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .diagram-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
      filter: drop-shadow(0 0 6px rgba(0,0,0,0.4));
    }

    /* Onderste balk ---------------------------------------------- */

    .bottom-panel {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
    }

    .music-controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .answer-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .answer-btn {
      padding: 12px 22px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: #2e104b;
      color: #fff;
      font-size: 15px;
      min-width: 150px;
      font-weight: 600;
      transition: 0.15s;
    }

    .answer-btn.correct {
      background: #01b37e;
    }

    .answer-btn.wrong {
      background: #e53935;
    }

    .answer-btn:active {
      transform: scale(0.97);
    }

    .feedback {
      margin-top: 12px;
      min-height: 20px;
      font-size: 15px;
    }
  </style>
<style id="remastered-theme">
:root{--bg1:#05091d!important;--bg2:#19104b!important;--panel:#101a39!important;--ink:#f8fbff!important;--muted:#c9d9ff!important;--accent:#00d9ff!important;--accent2:#ab4bff!important}
html{scroll-behavior:smooth}body{background:radial-gradient(ellipse at 50% -10%,#2d1867 0%,#080d2a 48%,#040615 100%) fixed!important;color:#f7faff!important;font-family:Inter,system-ui,Arial,sans-serif!important;min-height:100vh}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 69px,rgba(0,218,255,.035) 70px),radial-gradient(circle at 15% 30%,rgba(0,200,255,.13),transparent 30%),radial-gradient(circle at 85% 70%,rgba(183,60,255,.16),transparent 35%);animation:arenaGlow 12s ease-in-out infinite alternate}
@keyframes arenaGlow{from{opacity:.55}to{opacity:1}}
.nav-buttons{background:rgba(8,13,37,.92)!important;border-color:#b54dff!important;box-shadow:0 5px 25px #7222e744!important;flex-wrap:wrap;gap:8px!important}
.nav-buttons a{background:#141a40!important;border:1px solid #5965ac66;border-radius:12px!important;padding:10px 15px!important;color:#f6f8ff!important}
.nav-buttons a:hover,.nav-buttons a:focus-visible{background:#243e78!important;box-shadow:0 0 20px #00d9ff66;transform:translateY(-2px)}
h1{color:#fff!important;text-shadow:0 0 20px #ae46ff88,0 0 34px #00d9ff55!important;letter-spacing:.02em!important}
.card,.panel,.board-wrapper,.endbox{background:linear-gradient(145deg,rgba(20,34,78,.94),rgba(19,10,49,.95))!important;border:1px solid #5b8cf577!important;box-shadow:0 16px 50px #0009,0 0 25px #8548ff22!important;border-radius:22px!important}
button,.btn,.answer-btn,.opt-main,.opt-extra{transition:transform .18s ease,filter .18s ease,box-shadow .18s ease!important}
button:not(:disabled):hover,.btn:hover,.answer-btn:hover,.opt-main:hover,.opt-extra:hover{filter:brightness(1.16);transform:translateY(-2px);box-shadow:0 0 22px #00d9ff55!important}
button:focus-visible,a:focus-visible{outline:3px solid #00e5ff;outline-offset:3px}
button,.answer-btn{min-height:44px}
.board,.diagram,.diagram-wrap{box-shadow:inset 0 0 30px #00d9ff18!important}
.feedback{font-weight:700}
@media(max-width:680px){.nav-buttons{padding:8px!important}.nav-buttons a{font-size:13px!important;padding:9px!important}.page,.wrap{padding-left:12px!important;padding-right:12px!important}.bottom-panel,.qa-row{gap:12px!important}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head>
<body>

  <!-- NAVIGATIEBALK -->
  <div class="nav-buttons">
    <a href="home.html">Home</a>
    <a href="intro.html">Intro</a>
    <a href="level1.html">Level 1</a>
    <a href="level2.html">Level 2</a>
    <a href="level3.html">Level 3</a>
  </div>

  <div class="page">
    <div class="top-bar">
      <div>
        <h1>LEVEL 1 — Binnen of buitenhoek</h1>
        <div class="small" id="questionText">
          Is ∠A1 een binnenhoek of een buitenhoek?
        </div>
      </div>
      <button class="btn btn-primary" id="restartBtn">Herstart</button>
    </div>

    <div class="status-bar">
      <div>
        <span id="progressText">Vraag 1 / 10</span>
        <span id="scoreText">Score: 0</span>
      </div>
      <button class="btn btn-primary" id="nextBtn" disabled>Volgende vraag</button>
    </div>

    <!-- VASTE PLAATS VOOR TE BENOEMEN HOEK -->
    <div class="angle-name-container">
      <span class="angle-name-label">Te benoemen hoek:</span>
      <span class="angle-name-value" id="angleNameText">∠A1</span>
    </div>

    <div class="board-wrapper">
      <div class="board">
        <div class="diagram">
          <div class="diagram-inner">
            <!-- Jouw figuur -->
            <img src="images/hoeken-soundangles.svg" alt="Hoekenfiguur" class="diagram-image">
          </div>
        </div>
      </div>
    </div>

    <div class="bottom-panel">
      <div class="music-controls">
        <button class="btn btn-secondary" id="listenBtn">🎵 Nog eens luisteren</button>
        <button class="btn btn-secondary" id="stopMusicBtn">⏹ Stop muziek</button>
        <span class="small">Niveau 1</span>
      </div>

      <div class="answer-buttons">
        <button class="answer-btn" id="btnBinnen">Binnenhoek</button>
        <button class="answer-btn" id="btnBuiten">Buitenhoek</button>
      </div>
    </div>

    <div class="feedback" id="feedbackText"></div>
  </div>

  <script>
    /* =======================
       AUDIO
       ======================= */

    const binnenSources = [
      "https://raw.githubusercontent.com/Intunez/3SoundAngles3/main/audio/hint_major_level1.mp3",
      "audio/hint_major_level2.mp3",
      "audio/hint_major_level3.mp3",
      "audio/hint_major_level4.mp3"
    ];

    const buitenSources = [
      "audio/hint_minor_level1.mp3",
      "audio/hint_minor_level2.mp3",
      "audio/hint_minor_level3.mp3",
      "audio/hint_minor_level4.mp3"
    ];

    let currentHint = null;

    function stopCurrentHint() {
      if (currentHint) {
        currentHint.pause();
        currentHint.currentTime = 0;
        currentHint = null;
      }
    }

    function playRandomHint(type) {
      stopCurrentHint();
      const list = type === "binnen" ? binnenSources : buitenSources;
      const index = Math.floor(Math.random() * list.length);
      currentHint = new Audio(list[index]);
      currentHint.play().catch(() => { feedbackText.textContent = "Tik op Nog eens luisteren om de muziek te starten."; });
    }

    /* =======================
       VRAGEN
       ======================= */

    // Binnenhoeken: A3, A4, B1, B2
    const questions = [
      { angle: "A1", correct: "buiten" },
      { angle: "A2", correct: "buiten" },
      { angle: "A3", correct: "binnen" },
      { angle: "A4", correct: "binnen" },
      { angle: "B1", correct: "binnen" },
      { angle: "B2", correct: "binnen" },
      { angle: "B3", correct: "buiten" },
      { angle: "B4", correct: "buiten" },
      { angle: "A3", correct: "binnen" },
      { angle: "B2", correct: "binnen" }
    ];

    let finishTimer = null;
    let currentIndex = 0;
    let score = 0;
    let answered = false;

    const questionText = document.getElementById("questionText");
    const progressText = document.getElementById("progressText");
    const scoreText = document.getElementById("scoreText");
    const feedbackText = document.getElementById("feedbackText");
    const nextBtn = document.getElementById("nextBtn");
    const restartBtn = document.getElementById("restartBtn");
    const btnBinnen = document.getElementById("btnBinnen");
    const btnBuiten = document.getElementById("btnBuiten");
    const listenBtn = document.getElementById("listenBtn");
    const stopMusicBtn = document.getElementById("stopMusicBtn");
    const angleNameText = document.getElementById("angleNameText");

    function showQuestion(index) {
      const q = questions[index];
      answered = false;
      if (finishTimer) { clearTimeout(finishTimer); finishTimer = null; }

      // reset knoppen
      btnBinnen.classList.remove("correct", "wrong");
      btnBuiten.classList.remove("correct", "wrong");
      nextBtn.disabled = true;
      feedbackText.textContent = "";

      // teksten
      questionText.textContent =
        "Is ∠" + q.angle + " een binnenhoek of een buitenhoek?";
      angleNameText.textContent = "∠" + q.angle;
      progressText.textContent = "Vraag " + (index + 1) + " / " + questions.length;
      scoreText.textContent = "Score: " + score;

      // muziek voor nieuwe vraag automatisch
      playRandomHint(q.correct);
    }

    function handleAnswer(answer) {
      if (answered) return;
      
      const q = questions[currentIndex];
      const correct = q.correct;

      // muziek stoppen bij antwoord
      stopCurrentHint();

      if (answer === correct) {
        answered = true;
        score++;
        feedbackText.textContent = "Goed gedaan! Dit is een " + correct + "hoek.";
        if (answer === "binnen") {
          btnBinnen.classList.add("correct");
        } else {
          btnBuiten.classList.add("correct");
        }
      } else {
        feedbackText.textContent = "Niet juist. Probeer opnieuw en kijk waar de hoek ligt.";
        if (answer === "binnen") {
          btnBinnen.classList.add("wrong");
          setTimeout(() => btnBinnen.classList.remove("wrong"), 900);
        } else {
          btnBuiten.classList.add("wrong");
          setTimeout(() => btnBuiten.classList.remove("wrong"), 900);
        }
      }

      if (!answered) return;
      scoreText.textContent = "Score: " + score;

      if (currentIndex < questions.length - 1) {
        // Er zijn nog vragen
        nextBtn.disabled = false;
      } else {
        // Laatste vraag: knop uitzetten en automatisch naar level 2
        nextBtn.disabled = true;
        questionText.textContent += " (Laatste vraag)";
        finishTimer = setTimeout(() => finishLevel1(), 2000);  // 2 seconden wachten
      }
    }

    btnBinnen.addEventListener("click", () => handleAnswer("binnen"));
    btnBuiten.addEventListener("click", () => handleAnswer("buiten"));

    nextBtn.addEventListener("click", () => {
      if (currentIndex < questions.length - 1) {
        currentIndex++;
        showQuestion(currentIndex);
      }
    });

    restartBtn.addEventListener("click", () => {
      if (finishTimer) { clearTimeout(finishTimer); finishTimer = null; }
      currentIndex = 0;
      score = 0;
      stopCurrentHint();
      showQuestion(currentIndex);
    });

    listenBtn.addEventListener("click", () => {
      const q = questions[currentIndex];
      playRandomHint(q.correct);
    });

    stopMusicBtn.addEventListener("click", () => {
      stopCurrentHint();
    });

    // Start spel
    showQuestion(currentIndex);

    function finishLevel1() {
      saveSolo(1,score,questions.length);
      if(!new URLSearchParams(location.search).has("solo"))window.location.href = "level2.html";
    }
  
function saveSolo(level,score,max){
  try{const key='soundangles_solo_v1';let data=JSON.parse(localStorage.getItem(key)||'{}');let prev=data[level]||{};let record=(!prev.played||score>prev.best);data[level]={played:(prev.played||0)+1,best:Math.max(prev.best||0,score),max,latest:score,updated:Date.now()};localStorage.setItem(key,JSON.stringify(data));if(new URLSearchParams(location.search).has('solo')){const box=document.createElement('div');box.setAttribute('role','status');box.style.cssText='position:fixed;z-index:999999;bottom:20px;left:50%;transform:translateX(-50%);width:min(94vw,530px);padding:18px;border:2px solid #74eaff;border-radius:18px;background:#111936;color:white;box-shadow:0 0 35px #50dfff66;text-align:center;font:700 18px system-ui';let badge=score===max?'🏆 PERFECT SCORE':score/max>=.8?'🥇 GOUD':score/max>=.6?'🥈 ZILVER':'🥉 BRONS';box.innerHTML='<div>'+badge+' · '+score+'/'+max+(record?' · NIEUW RECORD!':'')+'</div><a href="solo.html" style="display:inline-block;margin-top:10px;padding:10px 18px;border-radius:10px;background:#6feaff;color:#101331;text-decoration:none">← TERUG NAAR SOLO QUEST</a>';document.body.appendChild(box)}}catch(e){console.warn('Solo voortgang niet opgeslagen',e)}
}
</script>
</body>
</html>
